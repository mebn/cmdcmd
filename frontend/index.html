<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>cmdcmd</title>
</head>
<body>
<div id="stage">
    <div id="panel">
        <section id="window">
            <div id="chat">
                <div id="notice" hidden>
                    <span id="notice-text"></span>
                    <button id="notice-settings" type="button" hidden>Open Settings</button>
                </div>
                <div id="menu" role="listbox" hidden></div>
            </div>

            <form id="composer" autocomplete="off">
                <textarea id="input" rows="1" placeholder="Ask AI, or type / for commands" spellcheck="false" autofocus></textarea>
                <button id="send" class="send-button" type="submit" title="Send (Enter)" aria-label="Send" disabled>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
                </button>
            </form>
        </section>

        <div id="dock">
            <div id="tray">
                <button id="new" class="icon-button" type="button" title="New session (⌘N)" aria-label="New session">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                </button>
                <div id="session-row" role="listbox" aria-label="Sessions"></div>
                <button id="settings-button" class="icon-button" type="button" title="Settings" aria-label="Settings" aria-haspopup="dialog" aria-expanded="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Top level so it layers above every card. -->
<div id="settings-pop" class="popover" role="dialog" aria-label="Settings" hidden>
    <div class="popover-scroll">
        <section class="option-section">
            <div class="section-title">Agent</div>
            <div id="agent-list" class="option-list"></div>
            <div class="custom-cmd">
                <label for="custom-input">Custom command</label>
                <input id="custom-input" type="text" spellcheck="false" autocomplete="off" placeholder="e.g. ollama run llama3">
                <div class="custom-hint">Gets each message on stdin and replies on stdout. Enter to use it.</div>
            </div>
        </section>
        <section class="option-section">
            <div class="section-title">Model</div>
            <div id="model-list" class="option-list"></div>
        </section>
        <section class="option-section">
            <div class="section-title">Effort</div>
            <div id="effort-list" class="option-list"></div>
        </section>
    </div>
</div>

<script src="./src/main.js" type="module"></script>
</body>
</html>
