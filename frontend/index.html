<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>cmdcmd</title>
</head>
<body>
<div id="stage">
    <div id="panel">
        <section id="chat" class="surface">
            <div id="notice" hidden>
                <span id="notice-text"></span>
                <button id="notice-settings" type="button" hidden>Open Settings</button>
            </div>
            <div id="history"></div>
            <div id="menu" role="listbox" hidden></div>
        </section>

        <div id="dock">
            <form id="composer" class="surface" autocomplete="off">
                <textarea id="input" rows="1" placeholder="Ask AI, or type / for commands" spellcheck="false" autofocus></textarea>
                <button id="send" class="send-button" type="submit" title="Send (Enter)" aria-label="Send" disabled>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
                </button>
            </form>

            <div id="tray">
                <button id="new" class="chip" type="button" title="New session (⌘N)">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                    New session
                </button>
                <span class="spacer"></span>
                <button id="agent-button" class="chip picker" type="button" title="Agent" aria-haspopup="listbox" aria-expanded="false">
                    <span class="label"></span>
                    <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
                </button>
                <button id="model-button" class="chip picker" type="button" title="Model" aria-haspopup="listbox" aria-expanded="false">
                    <span class="label"></span>
                    <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
                </button>
                <button id="effort-button" class="chip picker" type="button" title="Effort" aria-haspopup="listbox" aria-expanded="false">
                    <span class="label"></span>
                    <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Top level so it layers above every card. The three pickers share it. -->
<div id="picker-pop" class="popover" role="listbox" hidden>
    <div class="popover-scroll">
        <div id="pop-list" class="option-list"></div>
        <div id="custom-cmd" class="custom-cmd" hidden>
            <label for="custom-input">Custom command</label>
            <input id="custom-input" type="text" spellcheck="false" autocomplete="off" placeholder="e.g. ollama run llama3">
            <div class="custom-hint">Gets each message on stdin and replies on stdout. Enter to use it.</div>
        </div>
    </div>
</div>

<script src="./src/main.js" type="module"></script>
</body>
</html>
