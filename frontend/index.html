<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>cmdcmd</title>
</head>
<body>
<div id="stage">
    <div id="panel">
        <section id="window">
            <div id="chat">
                <div id="notice" hidden>
                    <span id="notice-text"></span>
                    <button id="notice-settings" type="button" hidden>Open Settings</button>
                </div>
                <div id="menu" role="listbox" hidden></div>
            </div>

            <!-- One box: the input, and below it New, the folder picker, the
                 sessions of the selected folder and settings. -->
            <div id="input-box">
                <form id="composer" autocomplete="off">
                    <div id="attachments"><div class="attachments-clip"><div class="attachments-track"></div></div></div>
                    <button id="attach" class="icon-button" type="button" data-tip="Attach files or images" aria-label="Attach files">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                    </button>
                    <textarea id="input" rows="1" placeholder="Ask AI" spellcheck="false" autofocus></textarea>
                    <button id="send" class="send-button" type="submit" title="Send (Enter)" aria-label="Send" disabled>
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
                    </button>
                </form>
                <div id="session-bar" class="bar">
                    <button id="new" class="icon-button" type="button" data-tip="New session or folder" aria-label="New" aria-haspopup="menu" aria-expanded="false">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="M18.4 2.6a2 2 0 0 1 2.8 2.8L12 14.6l-3.6.9.9-3.6z"/></svg>
                    </button>
                    <button id="folder-button" class="chip folder" type="button" aria-label="Folder" aria-haspopup="menu" aria-expanded="false">
                        <span class="status"></span><span class="chip-name"></span>
                        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
                    </button>
                    <div id="session-row" class="chip-row" role="listbox" aria-label="Sessions"></div>
                    <button id="settings-button" class="icon-button" type="button" data-tip="Settings" aria-label="Settings" aria-haspopup="dialog" aria-expanded="false">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    </button>
                </div>
            </div>
        </section>
    </div>
</div>

<!-- Popovers, menus and the tooltip are top level so they layer above every
     card. -->
<div id="settings-pop" class="popover" role="dialog" aria-label="Settings" hidden>
    <div class="popover-scroll">
        <section class="expander" data-kind="agent">
            <button class="expander-head" type="button" aria-expanded="false">
                <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
                <span class="expander-title">Agent</span>
                <span class="expander-value"></span>
            </button>
            <div class="expander-body"><div class="expander-inner">
                <div id="agent-list" class="option-list"></div>
            </div></div>
        </section>
        <section class="expander" data-kind="model">
            <button class="expander-head" type="button" aria-expanded="false">
                <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
                <span class="expander-title">Model</span>
                <span class="expander-value"></span>
            </button>
            <div class="expander-body"><div class="expander-inner">
                <div id="model-list" class="option-list"></div>
            </div></div>
        </section>
        <section class="expander" data-kind="effort">
            <button class="expander-head" type="button" aria-expanded="false">
                <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
                <span class="expander-title">Effort</span>
                <span class="expander-value"></span>
            </button>
            <div class="expander-body"><div class="expander-inner">
                <div id="effort-list" class="option-list"></div>
            </div></div>
        </section>
    </div>
</div>

<div id="new-menu" class="popover menu-pop" role="menu" aria-label="New" hidden>
    <div class="popover-scroll">
        <button class="menu-item" type="button" role="menuitem" data-action="session">
            <span class="menu-label">New session</span><kbd class="shortcut" data-keys="mod+N"></kbd>
        </button>
        <button class="menu-item" type="button" role="menuitem" data-action="folder">
            <span class="menu-label">New folder…</span><kbd class="shortcut" data-keys="shift+mod+N"></kbd>
        </button>
    </div>
</div>

<div id="folder-menu" class="popover menu-pop" role="menu" aria-label="Folders" hidden>
    <div class="popover-scroll"></div>
</div>

<div id="context-menu" class="popover menu-pop" role="menu" hidden>
    <div class="popover-scroll"></div>
</div>

<div id="tip" role="tooltip" hidden></div>

<script>
    // The Wails runtime maximises the window on a double-click in a drag
    // region. cmdcmd's window is a fixed stage, so swallow those first; this
    // runs before the runtime (a module) adds its own listener.
    window.addEventListener('dblclick', e => {
        const style = getComputedStyle(e.target);
        if (style.getPropertyValue('--wails-draggable').trim() === 'drag') e.stopImmediatePropagation();
    }, {capture: true});
</script>
<script src="./src/main.js" type="module"></script>
</body>
</html>
